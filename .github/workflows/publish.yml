# Fits the day's slate, scores results, commits the static site in public/
# plus the snapshot archive, then packages what Vercel serves into site/ and
# deploys it to the hr-daily-tracker Vercel project -- the NFL tracker's way:
# the heavy work runs here, Vercel serves the pages and api/live.py alone.
#
# Needs the MLB repository secret, a Vercel token (vercel.com/account/tokens); without
# it the site is still committed, and the deploy step says what is missing.
name: Publish site

on:
  schedule:
    # UTC, hourly through game hours (11:00-02:00 ET): each run refits with
    # the latest lineups and scratches. Scores are live via api/live.py.
    - cron: "5 15-23 * * *"
    - cron: "5 0-6 * * *"
  push:
    branches: [main]
    paths: ["src/**", "api/**", "vercel.json", ".github/workflows/publish.yml"]
  workflow_dispatch:
    inputs:
      force_fit:
        description: "Refit the slate even if the saved one is fresh"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
      PYTHONUNBUFFERED: "1"
      # Refit on every hourly run unless the day is complete.
      PUBLISH_SLATE_TTL_MINUTES: "45"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATA_REPO: ${{ secrets.HF_DATA_REPO }}
    steps:
      - uses: actions/checkout@v4

      - name: WeasyPrint system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ml.txt
            requirements-app.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-ml.txt
          pip install -r requirements-app.txt

      - name: Pull model data from Hugging Face
        run: python -m mlb_hr.hf_data pull

      - name: Fit, score and render
        run: python -m mlb_hr.publish --out public ${{ inputs.force_fit && '--force-fit' || '' }}

      - name: Push refreshed data to Hugging Face
        if: success()
        run: python -m mlb_hr.hf_data push

      - name: Commit site and snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public snapshots
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Publish $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -X theirs origin main
          git push

      - name: Assemble the site
        run: |
          rm -rf site && mkdir -p site/src site/snapshots/homer
          cp -r vercel.json requirements.txt api public site/
          rsync -a --exclude data --exclude __pycache__ src/mlb_hr site/src/
          cp snapshots/current.json snapshots/*-slate.json.gz site/snapshots/
          cp snapshots/homer/*.json site/snapshots/homer/ 2>/dev/null || true
          du -sh site

      - name: Deploy to Vercel
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.MLB }}
          VERCEL_ORG_ID: team_b9Ang4tfUOFZfL5RCz3UOl29
          VERCEL_PROJECT_ID: prj_d65zPfscnREEHTzuBrqIdZZT7BBv
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Add the MLB repository secret, a Vercel token (vercel.com/account/tokens), to deploy"; exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
