apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hr-daily-tracker-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hr-daily-tracker-snapshots
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
