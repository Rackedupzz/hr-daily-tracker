# Optional. Copy to secret.yaml (gitignored), fill in, then:
#   kubectl apply -f k8s/secret.yaml
# Or skip the file:
#   kubectl create secret generic hr-daily-tracker-keys \
#     --from-literal=NVIDIA_API_KEY=nvapi-... --from-literal=HF_TOKEN=hf_... --from-literal=HF_DATA_REPO=user/hr-daily-tracker-data
# The Deployment marks this secret optional, so the app runs without it.
apiVersion: v1
kind: Secret
metadata:
  name: hr-daily-tracker-keys
type: Opaque
stringData:
  NVIDIA_API_KEY: ""
  HF_TOKEN: ""
  HF_DATA_REPO: ""
